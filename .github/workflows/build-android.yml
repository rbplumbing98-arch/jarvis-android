name: Build J.A.R.V.I.S. Android APK

on:
  push:
    branches: [main]
    paths:
      - "jarvis-android-apk-build-ready.zip"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project archive
        shell: bash
        run: |
          set -euo pipefail
          test -f jarvis-android-apk-build-ready.zip
          mkdir -p "$RUNNER_TEMP/jarvis-source"
          unzip -q jarvis-android-apk-build-ready.zip -d "$RUNNER_TEMP/jarvis-source"
          echo "Archive contents:"
          find "$RUNNER_TEMP/jarvis-source" -maxdepth 4 -type f | sort | head -200
          PROJECT_DIR="$(find "$RUNNER_TEMP/jarvis-source" -name settings.gradle.kts -o -name settings.gradle | head -1 | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No Gradle settings file was found in the uploaded archive."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project root: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
